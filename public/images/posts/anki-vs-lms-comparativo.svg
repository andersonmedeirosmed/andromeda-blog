<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="ankiBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="lmsBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="conclusionBg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <filter id="cardSh7" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="880" fill="#f8fafc"/>
  <rect x="60" y="35" width="200" height="22" rx="11" fill="#f1f5f9"/>
  <text x="160" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b" letter-spacing="2">COMPARATIVO HONESTO</text>
  <text x="60" y="90" font-size="24" font-weight="700" fill="#0f172a">Anki vs LMS com flashcards nativos</text>
  <text x="60" y="115" font-size="13" fill="#64748b">Cada ferramenta existe para um propósito. Ambas são excelentes. A escolha depende do que você quer fazer.</text>
  <rect x="60" y="150" width="320" height="90" rx="10" fill="#1e293b"/>
  <text x="80" y="180" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2">DIMENSÃO</text>
  <text x="80" y="205" font-size="14" font-weight="600" fill="#ffffff">Critérios de comparação</text>
  <text x="80" y="222" font-size="11" fill="#cbd5e1" font-style="italic">o que importa na decisão</text>
  <g filter="url(#cardSh7)"><rect x="395" y="150" width="380" height="90" rx="10" fill="url(#ankiBg)"/></g>
  <text x="415" y="180" font-size="11" font-weight="700" fill="#dbeafe" letter-spacing="2">PARA CONSUMIR</text>
  <text x="415" y="208" font-size="22" font-weight="700" fill="#ffffff">Anki</text>
  <text x="415" y="228" font-size="12" fill="#bfdbfe" font-style="italic">Software gratuito, open source · padrão mundial</text>
  <g filter="url(#cardSh7)"><rect x="790" y="150" width="350" height="90" rx="10" fill="url(#lmsBg)"/></g>
  <text x="810" y="180" font-size="11" font-weight="700" fill="#ccfbf1" letter-spacing="2">PARA VENDER</text>
  <text x="810" y="208" font-size="22" font-weight="700" fill="#ffffff">LMS com flashcards nativos</text>
  <text x="810" y="228" font-size="12" fill="#99f6e4" font-style="italic">Andromeda e similares · plataforma fechada</text>
  <rect x="60" y="255" width="1080" height="55" rx="6" fill="#ffffff"/>
  <text x="80" y="282" font-size="13" font-weight="700" fill="#0f172a">Modelo de distribuição</text>
  <text x="80" y="299" font-size="11" fill="#64748b">como o conteúdo chega ao aluno</text>
  <text x="415" y="282" font-size="13" font-weight="600" fill="#1e40af">Arquivo (.apkg)</text>
  <text x="415" y="299" font-size="11" fill="#64748b">aluno baixa e tem o produto</text>
  <text x="810" y="282" font-size="13" font-weight="600" fill="#0f766e">Cloud no servidor</text>
  <text x="810" y="299" font-size="11" fill="#64748b">aluno acessa pela plataforma</text>
  <rect x="60" y="316" width="1080" height="55" rx="6" fill="#f1f5f9"/>
  <text x="80" y="343" font-size="13" font-weight="700" fill="#0f172a">Compartilhamento de decks</text>
  <text x="80" y="360" font-size="11" fill="#64748b">capacidade de copiar e redistribuir</text>
  <text x="415" y="343" font-size="13" font-weight="600" fill="#1e40af">Aberto e cultural</text>
  <text x="415" y="360" font-size="11" fill="#64748b">comunidade espera free sharing</text>
  <text x="810" y="343" font-size="13" font-weight="600" fill="#0f766e">Controlado tecnicamente</text>
  <text x="810" y="360" font-size="11" fill="#64748b">não há arquivo para compartilhar</text>
  <rect x="60" y="377" width="1080" height="55" rx="6" fill="#ffffff"/>
  <text x="80" y="404" font-size="13" font-weight="700" fill="#0f172a">Custo para o aluno</text>
  <text x="80" y="421" font-size="11" fill="#64748b">modelo financeiro do consumidor</text>
  <text x="415" y="404" font-size="13" font-weight="600" fill="#1e40af">Gratuito</text>
  <text x="415" y="421" font-size="11" fill="#64748b">decks legendários sem custo</text>
  <text x="810" y="404" font-size="13" font-weight="600" fill="#0f766e">Assinatura mensal/anual</text>
  <text x="810" y="421" font-size="11" fill="#64748b">acesso e atualização contínua</text>
  <rect x="60" y="438" width="1080" height="55" rx="6" fill="#f1f5f9"/>
  <text x="80" y="465" font-size="13" font-weight="700" fill="#0f172a">Algoritmo de repetição espaçada</text>
  <text x="80" y="482" font-size="11" fill="#64748b">qualidade técnica do método</text>
  <circle cx="423" cy="466" r="8" fill="#22c55e"/><text x="437" y="471" font-size="13" font-weight="600" fill="#16a34a">Excelente (FSRS)</text>
  <text x="415" y="487" font-size="11" fill="#64748b">referência mundial em SRS</text>
  <circle cx="818" cy="466" r="8" fill="#22c55e"/><text x="832" y="471" font-size="13" font-weight="600" fill="#16a34a">Excelente (FSRS/SM-2)</text>
  <text x="810" y="487" font-size="11" fill="#64748b">algoritmos equivalentes nativos</text>
  <rect x="60" y="499" width="1080" height="55" rx="6" fill="#ffffff"/>
  <text x="80" y="526" font-size="13" font-weight="700" fill="#0f172a">Atualizações pelo criador</text>
  <text x="80" y="543" font-size="11" fill="#64748b">capacidade de manter conteúdo vivo</text>
  <text x="415" y="526" font-size="13" font-weight="600" fill="#1e40af">Fragmentada</text>
  <text x="415" y="543" font-size="11" fill="#64748b">cada aluno fica em uma versão</text>
  <text x="810" y="526" font-size="13" font-weight="600" fill="#0f766e">Centralizada e imediata</text>
  <text x="810" y="543" font-size="11" fill="#64748b">todos veem a versão atual</text>
  <rect x="60" y="560" width="1080" height="55" rx="6" fill="#f1f5f9"/>
  <text x="80" y="587" font-size="13" font-weight="700" fill="#0f172a">Métricas de uso para o criador</text>
  <text x="80" y="604" font-size="11" fill="#64748b">insights sobre como aluno consome</text>
  <text x="415" y="587" font-size="13" font-weight="600" fill="#1e40af">Praticamente zero</text>
  <text x="415" y="604" font-size="11" fill="#64748b">aluno estuda offline, em sua máquina</text>
  <text x="810" y="587" font-size="13" font-weight="600" fill="#0f766e">Detalhadas em tempo real</text>
  <text x="810" y="604" font-size="11" fill="#64748b">por cartão, por área, por aluno</text>
  <rect x="60" y="621" width="1080" height="55" rx="6" fill="#ffffff"/>
  <text x="80" y="648" font-size="13" font-weight="700" fill="#0f172a">Defensibilidade do produto</text>
  <text x="80" y="665" font-size="11" fill="#64748b">proteção contra cópia e redistribuição</text>
  <circle cx="423" cy="649" r="8" fill="#ef4444"/><text x="437" y="654" font-size="13" font-weight="600" fill="#dc2626">Baixíssima</text>
  <text x="415" y="670" font-size="11" fill="#64748b">decks vazam em horas</text>
  <circle cx="818" cy="649" r="8" fill="#22c55e"/><text x="832" y="654" font-size="13" font-weight="600" fill="#16a34a">Alta</text>
  <text x="810" y="670" font-size="11" fill="#64748b">ecossistema fechado + algoritmo nativo</text>
  <rect x="60" y="682" width="1080" height="55" rx="6" fill="#f1f5f9"/>
  <text x="80" y="709" font-size="13" font-weight="700" fill="#0f172a">Receita recorrente viável</text>
  <text x="80" y="726" font-size="11" fill="#64748b">modelo de assinatura sustentável</text>
  <circle cx="423" cy="710" r="8" fill="#ef4444"/><text x="437" y="715" font-size="13" font-weight="600" fill="#dc2626">Impraticável</text>
  <text x="415" y="731" font-size="11" fill="#64748b">aluno baixa uma vez, cancela</text>
  <circle cx="818" cy="710" r="8" fill="#22c55e"/><text x="832" y="715" font-size="13" font-weight="600" fill="#16a34a">Modelo nativo</text>
  <text x="810" y="731" font-size="11" fill="#64748b">retenção alta, MRR previsível</text>
  <g filter="url(#cardSh7)"><rect x="60" y="770" width="1080" height="100" rx="14" fill="url(#conclusionBg)"/></g>
  <text x="80" y="800" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="2">A REGRA QUE FAZ A DIFERENÇA</text>
  <text x="80" y="828" font-size="15" font-weight="700" fill="#ffffff">Anki é a melhor ferramenta do mundo para CONSUMIR flashcards · LMS com proteção é a única forma de VENDER.</text>
  <text x="80" y="853" font-size="12" fill="#cbd5e1">Quem usa Anki para estudar segue usando Anki. Quem quer transformar conhecimento em receita recorrente precisa de infraestrutura diferente.</text>
  <g transform="translate(900, 790)"><rect x="0" y="0" width="220" height="60" rx="10" fill="#16a34a"/><text x="110" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="2">PARA QUEM QUER VENDER</text><text x="110" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Plataforma com proteção</text></g>
</svg>
