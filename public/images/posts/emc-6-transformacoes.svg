<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="720" fill="#f8fafc"/>
  <text x="500" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">As 6 transformações da Educação Médica Continuada em 2026</text>
  <text x="500" y="82" text-anchor="middle" font-size="14" fill="#64748b">O que mudou na forma como o médico aprende — e como hospitais e sociedades precisam se adaptar</text>
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="300" height="260" rx="14" fill="#ffffff"/>
    <rect x="40" y="120" width="300" height="6" rx="3" fill="url(#g1)"/>
    <circle cx="80" cy="170" r="22" fill="url(#g1)"/>
    <text x="80" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
    <g transform="translate(265, 148)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
      <line x1="20" y1="20" x2="20" y2="10" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="20" y1="20" x2="27" y2="22" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="60" y="225" font-size="16" font-weight="700" fill="#0f172a">Microlearning</text>
    <text x="60" y="247" font-size="13" fill="#475569">substitui aulas longas</text>
    <text x="60" y="285" font-size="12" fill="#64748b">Cápsulas de 3–7 minutos</text>
    <text x="60" y="303" font-size="12" fill="#64748b">aplicáveis em plantão.</text>
    <text x="60" y="321" font-size="12" fill="#64748b">Consumo mobile, entre</text>
    <text x="60" y="339" font-size="12" fill="#64748b">atendimentos.</text>
    <rect x="60" y="352" width="100" height="20" rx="10" fill="#dbeafe"/>
    <text x="110" y="366" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">FORMATO</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="120" width="300" height="260" rx="14" fill="#ffffff"/>
    <rect x="350" y="120" width="300" height="6" rx="3" fill="url(#g2)"/>
    <circle cx="390" cy="170" r="22" fill="url(#g2)"/>
    <text x="390" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
    <g transform="translate(575, 150)">
      <circle cx="20" cy="20" r="4" fill="url(#g2)"/>
      <circle cx="8" cy="10" r="3" fill="url(#g2)"/>
      <circle cx="32" cy="10" r="3" fill="url(#g2)"/>
      <circle cx="8" cy="30" r="3" fill="url(#g2)"/>
      <circle cx="32" cy="30" r="3" fill="url(#g2)"/>
      <line x1="20" y1="20" x2="8" y2="10" stroke="url(#g2)" stroke-width="2"/>
      <line x1="20" y1="20" x2="32" y2="10" stroke="url(#g2)" stroke-width="2"/>
      <line x1="20" y1="20" x2="8" y2="30" stroke="url(#g2)" stroke-width="2"/>
      <line x1="20" y1="20" x2="32" y2="30" stroke="url(#g2)" stroke-width="2"/>
    </g>
    <text x="370" y="225" font-size="16" font-weight="700" fill="#0f172a">IA aplicada</text>
    <text x="370" y="247" font-size="13" fill="#475569">à educação médica</text>
    <text x="370" y="285" font-size="12" fill="#64748b">Resolução CFM 2.454/2026</text>
    <text x="370" y="303" font-size="12" fill="#64748b">reconhece IA como apoio</text>
    <text x="370" y="321" font-size="12" fill="#64748b">à EMC, com governança</text>
    <text x="370" y="339" font-size="12" fill="#64748b">e supervisão humana.</text>
    <rect x="370" y="352" width="120" height="20" rx="10" fill="#ccfbf1"/>
    <text x="430" y="366" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">REGULATÓRIO</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="120" width="300" height="260" rx="14" fill="#ffffff"/>
    <rect x="660" y="120" width="300" height="6" rx="3" fill="url(#g3)"/>
    <circle cx="700" cy="170" r="22" fill="url(#g3)"/>
    <text x="700" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <g transform="translate(885, 150)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="url(#g3)" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="11" fill="none" stroke="url(#g3)" stroke-width="2"/>
      <circle cx="20" cy="20" r="4" fill="url(#g3)"/>
